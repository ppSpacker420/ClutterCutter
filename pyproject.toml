[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cluttercutter"
version = "1.0.0"
description = "Automated local storage manager. Scans a cluttered folder, categorises files, and moves them - never deleting or overwriting."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["files", "organise", "cleanup", "utility", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
# Intentionally no runtime dependencies. Standard library only.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
# The CLI. Available on every platform after `pip install`.
cluttercutter = "cluttercutter.cli:main"
# The GUI. Separate entry point so a machine without tkinter can still use
# the CLI - importing the GUI at module level would break that install.
cluttercutter-gui = "cluttercutter.gui:main"

[tool.setuptools]
packages = ["cluttercutter"]

[tool.pytest.ini_options]
testpaths = ["tests"]